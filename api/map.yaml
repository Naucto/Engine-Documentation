namespace: map
title: Map
functions:
- name: draw
  signature: map.draw(x, y[, tx, ty, tw, th, m])
  summary: Draw a map (or a sub-rectangle of its tiles) at a pixel position. m picks the map, from 1.
  description: 'Draw the tilemap created in the map editor.


    This draws the entire map at once. The map uses the same 8 x 8 tile size as the sprite sheet.


    A game may keep several maps, made in the MAP tab. Each `map.*` call takes the map it works on
    as its last argument, counted from `1` in the order of the strip in that tab, and works on the
    first one when that argument is left out - so a game with one map never has to name it.


    To read map tiles from Lua, use [[map.get]]. To inspect sprite flags on a tile sprite, use [[map.flag]].'
  params:
  - name: x
    type: number
    description: X position in pixels where the map starts.
    required: true
  - name: y
    type: number
    description: Y position in pixels where the map starts.
    required: true
  - name: tx
    type: number
    description: Optional first map column to draw, in tiles. Defaults to `0`.
    optional: true
  - name: ty
    type: number
    description: Optional first map row to draw, in tiles. Defaults to `0`.
    optional: true
  - name: tw
    type: number
    description: Optional number of columns to draw. Defaults to the whole map width.
    optional: true
  - name: th
    type: number
    description: Optional number of rows to draw. Defaults to the whole map height.
    optional: true
  - name: m
    type: number
    description: Which map to draw, counted from `1` in the order of the MAP tab's strip. Defaults
      to the first.
    optional: true
  returns: null
  examples:
  - |-
    map.draw(0, 0)  -- draw the first map at the world origin
    map.draw(0, 0, 0, 0, 40, 23, 2)  -- the top-left screen of the second map
  notes: []
  aliases:
  - map
  seeAlso:
  - gfx.camera
  - map.get
  since: '1.0'
- name: get
  signature: map.get(tx, ty[, m])
  summary: Sprite index at a tile of map m (the first by default).
  description: 'Read a tile from the map.


    `mget` uses tile coordinates, not pixel coordinates. Since each tile is `8 x 8` pixels, divide world
    positions by `8` and floor the result when converting a pixel position to a map tile.'
  params:
  - name: tx
    type: number
    description: Tile column in the map grid.
    required: true
  - name: ty
    type: number
    description: Tile row in the map grid.
    required: true
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true
  returns: Sprite index stored at that map cell.
  examples:
  - |-
    tile_x = math.floor(player.x / 8)
    tile_y = math.floor((player.y + 8) / 8)
    tile_sprite = map.get(tile_x, tile_y)
  notes:
  - kind: warning
    text: Reading outside the map raises a fatal runtime error that stops the game. A new game's map
      is **128 x 32 tiles** and can be made another size in the editor, so bounds-check against
      `map.width()` and `map.height()` rather than against those numbers (see the example below).
  aliases:
  - mget
  seeAlso:
  - map.set
  - map.flag
  since: '1.0'
- name: set
  signature: map.set(tx, ty, n[, m])
  summary: Change a tile of map m (the first by default) for this run only.
  description: Changes a tile for the rest of this run. The edit lives in memory only - the saved map
    is untouched, so a restart brings the level back.
  params:
  - name: tx
    type: number
    required: true
    description: Tile column, from `0` to `map.width() - 1`.
  - name: ty
    type: number
    required: true
    description: Tile row, from `0` to `map.height() - 1`.
  - name: n
    type: number
    required: true
    description: Sprite index to place, 0 for empty.
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true
  returns: null
  examples:
  - |-
    -- open the door once the key is taken
    map.set(24, 9, 0)
  notes: []
  aliases: []
  seeAlso:
  - map.get
  - map.draw
  since: '2.0'
- name: flag
  signature: map.flag(n[, bit])
  summary: Flags byte of sprite n, or one bit of it.
  description: 'Read the flags stored on a sprite in the Sprite Editor.


    A `spriteIndex` outside `0`--`255` or a `bit` outside `0`--`7` raises a fatal runtime error that stops
    the game.


    Use sprite flags to attach lightweight gameplay metadata to sprites. A common pattern is to mark map
    tile sprites with flag bits such as "solid" or "hazard", then check those flags after reading tiles
    with [[map.get]].'
  params:
  - name: n
    type: number
    description: Sprite index in the sprite sheet. A new game has 256 of them, numbered from `0`;
      a larger sheet has more.
    required: true
  - name: bit
    type: number
    description: Optional bit index from `0` to `7`.
    optional: true
  returns: The full flag value when `bit` is omitted, or `true`/`false` for a single bit.
  examples:
  - |-
    tile_sprite = map.get(tile_x, tile_y)

    if map.flag(tile_sprite, 0) then
      -- bit 0 is enabled: treat this tile as solid
    end

    flags = map.flag(tile_sprite)  -- full 0-255 flag value
  notes: []
  aliases:
  - fget
  seeAlso:
  - map.get
  - gfx.get_pixel
  since: '1.0'
- name: width
  signature: map.width([m])
  summary: Width of map m (the first by default), in tiles.
  description: Map width in tiles. A game chooses its own map size, and each of its maps has its
    own, so read this rather than assuming one.
  params:
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true

  returns: The map's width in tiles.
  examples:
  - |-
    local right_edge = map.width() * 8
  notes: []
  aliases: []
  seeAlso:
  - map.height
  since: '2.0'
- name: height
  signature: map.height([m])
  summary: Height of map m (the first by default), in tiles.
  description: Map height in tiles. A game chooses its own map size, and each of its maps has its
    own, so read this rather than assuming one.
  params:
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true

  returns: The map's height in tiles.
  examples:
  - |-
    local floor = map.height() * 8
  notes: []
  aliases: []
  seeAlso:
  - map.width
  since: '2.0'
values: []
