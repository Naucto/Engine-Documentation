namespace: map
title: Map
functions:
- name: draw
  signature: map.draw(x, y[, tx, ty, tw, th, m])
  summary: Draw a map (or a sub-rectangle of its tiles) at a pixel position. m picks the map, from 1.
  picture: img/frames/map-draw-region.png
  caption: 'A 12×8 window of the map, twelve rows above its floor, drawn at (40, 20) and outlined.'
  description: |-
    Draw the map, or the part of it that `tx`, `ty`, `tw`, `th` name, with its top-left corner at `x`, `y`. Tiles are the sheet's 8 × 8 sprites; a tile of sprite `0` is empty. The camera moves it like anything else, and a tile changed with `map.set` is drawn changed. `tw` and `th` left out are the whole width and height even when `tx`, `ty` are not `0`.

    A game may keep several maps, made in the MAP tab. Each `map.*` call takes the map it works on as its last argument, counted from `1` in the order of the strip in that tab, and works on the first one when that argument is left out.
  params:
  - name: x
    type: number
    description: X position in pixels where the map starts.
    required: true
  - name: y
    type: number
    description: Y position in pixels where the map starts.
    required: true
  - name: tx
    type: number
    description: Optional first map column to draw, in tiles. Defaults to `0`.
    optional: true
  - name: ty
    type: number
    description: Optional first map row to draw, in tiles. Defaults to `0`.
    optional: true
  - name: tw
    type: number
    description: Optional number of columns to draw. Defaults to the whole map width.
    optional: true
  - name: th
    type: number
    description: Optional number of rows to draw. Defaults to the whole map height.
    optional: true
  - name: m
    type: number
    description: Which map to draw, counted from `1` in the order of the MAP tab's strip. Defaults
      to the first.
    optional: true
  returns: null
  examples:
  - |-
    map.draw(0, 0)  -- draw the first map at the world origin
    map.draw(0, 0, 0, 0, 40, 23, 2)  -- the top-left screen of the second map (a warning, and nothing drawn, in a game with one map)
  notes: []
  aliases:
  - map
  seeAlso:
  - gfx.camera
  - map.get
  since: '1.0'
- name: get
  signature: map.get(tx, ty[, m])
  summary: Sprite index at a tile of map m (the first by default).
  description: 'Read the sprite number of a tile. Coordinates are tiles, not pixels: divide a position by `8` and floor it (the call floors them too). Outside the map the answer is `0`, the same as an empty tile, so guard the bounds where sprite `0` carries a flag. A map the game does not have answers `0` as well, with a warning in the console.'
  params:
  - name: tx
    type: number
    description: Tile column in the map grid.
    required: true
  - name: ty
    type: number
    description: Tile row in the map grid.
    required: true
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true
  returns: Sprite index stored at that map cell.
  examples:
  - |-
    local player = { x = 37, y = 50 }
    local tile_x = math.floor(player.x / 8)
    local tile_y = math.floor((player.y + 8) / 8)
    local tile_sprite = map.get(tile_x, tile_y)  -- the sprite under the player's feet
  notes:
  - kind: note
    text: 'A new game''s map is 128 × 32 tiles and can be another size: read `map.width()` and `map.height()` rather than assuming one.'
  aliases:
  - mget
  seeAlso:
  - map.set
  - map.flag
  since: '1.0'
- name: set
  signature: map.set(tx, ty, n[, m])
  summary: Change a tile of map m (the first by default) for this run only.
  picture: img/frames/map-set.png
  caption: 'The same window of the map before and after map.set(9, 26, 0): the outlined tile of the platform is gone on the right.'
  description: 'Change a tile for the rest of this run. The edit lives in memory only, the saved map is untouched, and reloading the game brings the level back. Out of the map, or on a map that does not exist, the call does nothing.'
  params:
  - name: tx
    type: number
    required: true
    description: Tile column, from `0` to `map.width() - 1`.
  - name: ty
    type: number
    required: true
    description: Tile row, from `0` to `map.height() - 1`.
  - name: n
    type: number
    required: true
    description: Sprite index to place, 0 for empty.
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true
  returns: null
  examples:
  - |-
    -- open the door once the key is taken
    map.set(24, 9, 0)
  notes: []
  aliases: []
  seeAlso:
  - map.get
  - map.draw
  since: '2.0'
- name: flag
  signature: map.flag(n[, bit])
  summary: Flags byte of sprite n, or one bit of it.
  description: 'Read the flags the ART tab stores on a sprite: eight bits the engine never reads, whose meaning is yours (bit `0` solid, bit `2` water). Without `bit` it is the whole byte, `0` to `255`; with it, `true` or `false`. Only the first sprite sheet has flags: a sprite on another sheet, or past the end, answers `0` (`false`), without an error. The usual pattern reads a tile with [[map.get]] and asks its sprite.'
  params:
  - name: n
    type: number
    description: Sprite index in the sprite sheet. A new game has 256 of them, numbered from `0`;
      a larger sheet has more.
    required: true
  - name: bit
    type: number
    description: Optional bit index from `0` to `7`.
    optional: true
  returns: The full flag value when `bit` is omitted, or `true`/`false` for a single bit.
  examples:
  - |-
    local tile_sprite = map.get(4, 6)

    if map.flag(tile_sprite, 0) then
      print("solid")  -- bit 0 is set on that sprite
    end

    local flags = map.flag(tile_sprite)  -- the whole byte, 0 to 255
  notes: []
  aliases:
  - fget
  seeAlso:
  - map.get
  - gfx.get_pixel
  since: '1.0'
- name: width
  signature: map.width([m])
  summary: Width of map m (the first by default), in tiles.
  description: 'Map width in tiles, from `1` to `256`. A game chooses its own map size, and each of its maps has its own, so read this rather than assuming one. A map the game does not have answers `0`, with a warning in the console.'
  params:
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true

  returns: The map's width in tiles.
  examples:
  - |-
    local right_edge = map.width() * 8
  notes: []
  aliases: []
  seeAlso:
  - map.height
  since: '2.0'
- name: height
  signature: map.height([m])
  summary: Height of map m (the first by default), in tiles.
  description: 'Map height in tiles, from `1` to `256`. A game chooses its own map size, and each of its maps has its own, so read this rather than assuming one. A map the game does not have answers `0`, with a warning in the console.'
  params:
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the
      first.
    optional: true

  returns: The map's height in tiles.
  examples:
  - |-
    local floor = map.height() * 8
  notes: []
  aliases: []
  seeAlso:
  - map.width
  since: '2.0'
values: []
