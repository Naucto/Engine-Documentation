namespace: gfx
title: Graphics
functions:
- name: clear
  signature: gfx.clear([colour])
  summary: Fill the screen with a palette colour (default 0).
  picture: img/frames/gfx-clear.png
  caption: 'The screen filled with palette colour 1, then a line of text over it.'
  description: 'Fill the whole screen with one colour, and start the frame from it: call it first in `_draw()`. It ignores the clip, the camera and any `set_col` remap: the colour goes straight to the screen.'
  params:
  - name: colour
    type: number
    description: 'Palette index, `0` to `15`; left out, `0`.'
    optional: true
  returns: null
  examples:
  - |-
    gfx.clear(0)   -- black background
    gfx.clear(11)  -- light blue background
  notes:
  - kind: note
    text: 'An index past `15` wraps around: `16` draws as `0` and `-1` as `15`. Nothing stops the game.'
  aliases:
  - clear
  seeAlso:
  - gfx.fill_rect
  - gfx.reset_palette
  since: '1.0'
- name: draw_sprite
  signature: gfx.draw_sprite(n, x, y[, w, h, flip_h, flip_v, scale, transparent])
  summary: Draw w×h tiles starting at sprite n. Colour 0 is the transparent one by default.
  picture: img/frames/gfx-draw-sprite.png
  caption: 'The same sprite plain, flipped horizontally, flipped vertically, and at scale 3.'
  description: 'Draw one sprite, or a block of them, from the sheet the ART tab edits. `w` and `h` count sprites: left out, one 8 × 8 sprite. A flip mirrors the whole block, tiles included. Transparency is tested on the sheet''s own colour, before any `set_col` remap. Positions are floored to whole pixels. A sprite number past the end of the sheet draws stretched edge pixels rather than failing.'
  params:
  - name: n
    type: number
    description: Sprite index in the sprite sheet. A new game has 256 of them, numbered from `0`;
      a larger sheet has more.
    required: true
  - name: x
    type: number
    description: Destination x position in pixels.
    required: true
  - name: y
    type: number
    description: Destination y position in pixels.
    required: true
  - name: w
    type: number
    description: Optional width in sprite units (1 unit = 8 pixels). Defaults to `1`.
    optional: true
  - name: h
    type: number
    description: Optional height in sprite units (1 unit = 8 pixels). Defaults to `1`.
    optional: true
  - name: flip_h
    type: boolean
    description: Mirror the sprite horizontally. Defaults to `false`.
    optional: true
  - name: flip_v
    type: boolean
    description: Mirror the sprite vertically. Defaults to `false`.
    optional: true
  - name: scale
    type: number
    description: 'Magnification of the drawn block; `1` by default. Whole numbers keep pixels square; `0` draws nothing.'
    optional: true
  - name: transparent
    type: number
    description: 'Which colour the sprite keeps clear. Left out, it is index `0`, the sheet''s
      transparency channel. Give an index to key that colour out instead, or `nil` to draw every
      colour: leaving the argument off and passing `nil` are different answers here.'
    optional: true
  returns: null
  examples:
  - |-
    gfx.draw_sprite(0, 10, 20)         -- one sprite at (10, 20)
    gfx.draw_sprite(32, 40, 50, 2, 1)  -- a strip two sprites wide, from sprite 32
    gfx.draw_sprite(0, 60, 20, 1, 2)   -- one wide, two tall (8 × 16 pixels)
    gfx.draw_sprite(0, 90, 20, 1, 1, true)          -- mirrored
    gfx.draw_sprite(0, 120, 20, 1, 1, false, false, 3) -- three times the size
  notes: []
  aliases:
  - sprite
  seeAlso:
  - gfx.draw_region
  - map.draw
  since: '1.0'
- name: draw_region
  signature: gfx.draw_region(sx, sy, sw, sh, dx, dy[, dw, dh, flip_h, flip_v, transparent])
  summary: Draw a pixel rectangle of the sprite sheet, optionally scaled.
  description: 'Copy any rectangle of pixels out of the sheet, rather than whole 8 × 8 sprites. Give `dw`/`dh` to stretch it; leave them out and it lands at its own size. Reads the first sheet only. A region past the sheet''s edge repeats the edge pixels.'
  params:
  - name: sx
    type: number
    required: true
    description: Left edge in sheet pixels.
  - name: sy
    type: number
    required: true
    description: Top edge in sheet pixels.
  - name: sw
    type: number
    required: true
    description: Width in sheet pixels.
  - name: sh
    type: number
    required: true
    description: Height in sheet pixels.
  - name: dx
    type: number
    required: true
    description: Left edge on screen.
  - name: dy
    type: number
    required: true
    description: Top edge on screen.
  - name: dw
    type: number
    optional: true
    description: Destination width; defaults to sw.
  - name: dh
    type: number
    optional: true
    description: Destination height; defaults to sh.
  - name: flip_h
    type: boolean
    optional: true
    description: Mirror horizontally.
  - name: flip_v
    type: boolean
    optional: true
    description: Mirror vertically.
  - name: transparent
    type: number
    optional: true
    description: Which colour the region keeps clear. Left out, index `0`; an index keys that colour
      out instead; `nil` draws every colour.
  returns: null
  examples:
  - |-
    -- a 24x8 banner from the sheet, drawn at double size
    gfx.draw_region(0, 32, 24, 8, 20, 12, 48, 16)
  notes: []
  aliases: []
  seeAlso:
  - gfx.draw_sprite
  since: '2.0'
- name: pixel
  signature: gfx.pixel(x, y, colour)
  summary: Set one screen pixel.
  picture: img/frames/gfx-shapes.png
  caption: 'rect, fill_rect, circle, fill_circle, line and pixel, each in its own colour.'
  description: 'Set one pixel. The position is in the world: the camera applies to it, and the clip keeps it inside its rectangle. Coordinates are floored.'
  params:
  - name: x
    type: number
    required: true
    description: 'Horizontal position, in pixels, before the camera offset.'
  - name: y
    type: number
    required: true
    description: 'Vertical position, in pixels, before the camera offset.'
  - name: colour
    type: number
    required: true
    description: 'Palette index `0` to `15`; left out, `0`.'
  returns: null
  examples:
  - |-
    -- a starfield
    local stars = { { x = 12, y = 30 }, { x = 80, y = 12 }, { x = 200, y = 44 } }
    for _, s in ipairs(stars) do
      gfx.pixel(s.x, s.y, 5)
    end
  notes: []
  aliases: []
  seeAlso:
  - gfx.get_pixel
  - gfx.line
  since: '2.0'
- name: get_pixel
  signature: gfx.get_pixel(x, y)
  summary: Read the palette index at a screen pixel (slow).
  description: 'Read the palette index at a position, in the same coordinates the drawing calls use, the camera applies. Off screen it answers `0`. It reads what was drawn, after any `set_col` remap and before the display effects.'
  params:
  - name: x
    type: number
    required: true
    description: 'Horizontal position, before the camera offset.'
  - name: y
    type: number
    required: true
    description: 'Vertical position, before the camera offset.'
  returns: Palette index 0..15.
  examples:
  - |-
    -- treat colour 2 as solid ground
    local player = { x = 40, y = 60, vy = 1 }
    if gfx.get_pixel(player.x, player.y + 8) == 2 then
      player.vy = 0
    end
  notes:
  - kind: warning
    text: 'Slow: it pulls the frame back from the GPU. Read what you need once a frame, never in a loop over pixels.'
  aliases: []
  seeAlso:
  - gfx.pixel
  - map.flag
  since: '2.0'
- name: line
  signature: gfx.line(x0, y0, x1, y1, colour)
  summary: Draw a one-pixel line.
  picture: img/frames/gfx-shapes.png
  caption: 'rect, fill_rect, circle, fill_circle, line and pixel, each in its own colour.'
  description: 'Draw a straight line between two points, both ends included. Coordinates are floored; the camera and the clip apply.'
  params:
  - name: x0
    type: number
    description: Start x position.
    required: true
  - name: y0
    type: number
    description: Start y position.
    required: true
  - name: x1
    type: number
    description: End x position.
    required: true
  - name: y1
    type: number
    description: End y position.
    required: true
  - name: colour
    type: number
    description: Palette color index.
    required: true
  returns: null
  examples:
  - |-
    gfx.line(0, 0, 319, 179, 8)  -- diagonal across the screen
  notes: []
  aliases:
  - line
  seeAlso:
  - gfx.rect
  - gfx.pixel
  since: '1.0'
- name: rect
  signature: gfx.rect(x, y, w, h, colour)
  summary: Draw a rectangle outline.
  picture: img/frames/gfx-shapes.png
  caption: 'rect, fill_rect, circle, fill_circle, line and pixel, each in its own colour.'
  description: 'Draw the outline of a rectangle. `x`, `y` is its top-left corner and `w`, `h` its size, not a second corner. The outline stays inside the box; a width or height of `0` draws nothing.'
  params:
  - name: x
    type: number
    description: Top-left x position.
    required: true
  - name: y
    type: number
    description: Top-left y position.
    required: true
  - name: w
    type: number
    description: Width in pixels.
    required: true
  - name: h
    type: number
    description: Height in pixels.
    required: true
  - name: colour
    type: number
    description: Palette color index.
    required: true
  returns: null
  examples:
  - |-
    gfx.rect(20, 20, 32, 16, 5)  -- a white outline
  notes: []
  aliases:
  - rect
  seeAlso:
  - gfx.fill_rect
  - gfx.circle
  since: '1.0'
- name: fill_rect
  signature: gfx.fill_rect(x, y, w, h, colour)
  summary: Draw a filled rectangle.
  picture: img/frames/gfx-shapes.png
  caption: 'rect, fill_rect, circle, fill_circle, line and pixel, each in its own colour.'
  description: 'Fill a rectangle. `x`, `y` is its top-left corner and `w`, `h` its size, floored to whole pixels; a width or height of `0` draws nothing.'
  params:
  - name: x
    type: number
    description: Top-left x position.
    required: true
  - name: y
    type: number
    description: Top-left y position.
    required: true
  - name: w
    type: number
    description: Width in pixels.
    required: true
  - name: h
    type: number
    description: Height in pixels.
    required: true
  - name: colour
    type: number
    description: Palette color index.
    required: true
  returns: null
  examples:
  - |-
    gfx.fill_rect(0, 160, 320, 20, 13)  -- a green ground strip
    gfx.fill_rect(30, 40, 10, 10, 2)    -- a small red square
  notes: []
  aliases:
  - fill_rect
  seeAlso:
  - gfx.rect
  - gfx.clear
  since: '1.0'
- name: circle
  signature: gfx.circle(cx, cy, r, colour)
  summary: Draw a circle outline.
  picture: img/frames/gfx-shapes.png
  caption: 'rect, fill_rect, circle, fill_circle, line and pixel, each in its own colour.'
  description: 'Draw the outline of a circle. The radius is floored; `0` draws one pixel, and the circle spans `2r + 1` pixels.'
  params:
  - name: cx
    type: number
    required: true
    description: Centre x.
  - name: cy
    type: number
    required: true
    description: Centre y.
  - name: r
    type: number
    required: true
    description: Radius in pixels.
  - name: colour
    type: number
    required: true
    description: Palette index 0..15.
  returns: null
  examples:
  - |-
    gfx.circle(160, 90, 24, 7)
  notes: []
  aliases: []
  seeAlso:
  - gfx.fill_circle
  - gfx.rect
  since: '2.0'
- name: fill_circle
  signature: gfx.fill_circle(cx, cy, r, colour)
  summary: Draw a filled circle.
  picture: img/frames/gfx-shapes.png
  caption: 'rect, fill_rect, circle, fill_circle, line and pixel, each in its own colour.'
  description: 'Fill a disc centred on `cx`, `cy`. The radius is floored; `0` draws one pixel.'
  params:
  - name: cx
    type: number
    required: true
    description: Centre x.
  - name: cy
    type: number
    required: true
    description: Centre y.
  - name: r
    type: number
    required: true
    description: Radius in pixels.
  - name: colour
    type: number
    required: true
    description: Palette index 0..15.
  returns: null
  examples:
  - |-
    -- a shrinking explosion
    local boom = { x = 160, y = 90, life = 12 }
    gfx.fill_circle(boom.x, boom.y, boom.life, 3)
  notes: []
  aliases: []
  seeAlso:
  - gfx.circle
  - gfx.fill_rect
  since: '2.0'
- name: print
  signature: gfx.print(text, x, y[, colour])
  summary: Draw text with the built-in 4×6 font; returns its width.
  picture: img/frames/gfx-print.png
  caption: 'Text at the default colour, in two others, and a number joined to a string.'
  description: 'Draw text with the built-in 4 × 6 font, in capitals, lowercase is drawn as uppercase, and a character outside plain ASCII takes its 4 pixels and shows nothing. A number is written as text. Returns the width of the last line drawn, which is what centring needs.'
  params:
  - name: text
    type: string
    required: true
    description: The text to draw.
  - name: x
    type: number
    required: true
    description: Left edge.
  - name: y
    type: number
    required: true
    description: Top edge.
  - name: colour
    type: number
    optional: true
    description: 'Palette index; left out, `5` (white in the default palette).'
  returns: Width of the drawn text in pixels.
  examples:
  - |-
    local score = 0
    gfx.print("score " .. score, 4, 4)

    -- centred: every glyph is 4 pixels wide
    local text = "GAME OVER"
    gfx.print(text, (gfx.width() - #text * 4) // 2, 80, 7)
  notes: []
  aliases: []
  seeAlso:
  - gfx.width
  - gfx.set_col
  since: '2.0'
- name: camera
  signature: gfx.camera([x, y])
  summary: Offset every later draw call; no arguments resets.
  picture: img/frames/gfx-camera.png
  caption: 'The map and a sprite drawn with the camera at (-40, -20): everything shifts right and down.'
  description: 'Move the view. Everything drawn after it is shifted by `-x`, `-y`, so a camera at `(40, 0)` scrolls the world 40 pixels to the left. `gfx.camera()` puts it back at the origin, and `gfx.camera(x)` alone sets `y` to `0`. Values are floored.'
  params:
  - name: x
    type: number
    description: 'Horizontal offset in pixels; `0` when left out.'
    optional: true
  - name: y
    type: number
    description: 'Vertical offset in pixels; `0` when left out.'
    optional: true
  returns: null
  examples:
  - |-
    -- keep the player in the middle of the 320 × 180 screen
    local player = { x = 500, y = 120 }
    gfx.camera(player.x - 160, player.y - 90)
  notes: []
  aliases:
  - camera
  seeAlso:
  - gfx.clip
  - map.draw
  since: '1.0'
- name: clip
  signature: gfx.clip([x, y, w, h])
  summary: Restrict drawing to a rectangle; no arguments resets.
  picture: img/frames/gfx-clip.png
  caption: 'A full-screen fill and a row of circles, only visible inside the clip rectangle outlined in white.'
  description: 'Keep every later draw call inside a rectangle of the screen; the rectangle is in screen pixels, the camera does not move it. `gfx.clip()` draws to the whole screen again. A new clip replaces the old one, it stays from one frame to the next, and `gfx.clear` ignores it.'
  params:
  - name: x
    type: number
    optional: true
    description: Left edge.
  - name: y
    type: number
    optional: true
    description: Top edge.
  - name: w
    type: number
    optional: true
    description: Width.
  - name: h
    type: number
    optional: true
    description: Height.
  returns: null
  examples:
  - |-
    local hp = 3
    gfx.clip(0, 0, 320, 120)  -- the play field
    map.draw(0, 0)
    gfx.clip()                -- the HUD over everything
    gfx.print("HP " .. hp, 4, 168, 5)
  notes:
  - kind: warning
    text: 'All four numbers or none: `gfx.clip(x)` sets the missing ones to `0`, a rectangle nothing fits in, and so does a negative width or height. The screen then stays blank until `gfx.clip()`.'
  aliases: []
  seeAlso:
  - gfx.camera
  since: '2.0'
- name: set_col
  signature: gfx.set_col(from, to)
  summary: 'Draw palette remap: pixels of colour `from` are drawn as `to`.'
  picture: img/frames/gfx-set-col.png
  caption: 'The same sprite plain, with its yellow drawn as white by set_col(4, 5), and plain again after reset_col.'
  description: 'Draw one colour as another, from this call on: sprites, shapes, the map and text all follow, `gfx.clear` does not. It holds until `gfx.reset_col()`, across frames too, so reset it before the next thing you draw plain. A sprite''s transparent colour stays transparent whatever it is mapped to.'
  params:
  - name: from
    type: number
    description: Palette slot to replace.
    required: true
  - name: to
    type: number
    description: Palette slot to copy into it.
    required: true
  returns: null
  examples:
  - |-
    -- flash the player white while hit
    local player = { spr = 1, x = 40, y = 40, hit_timer = 6 }
    if player.hit_timer > 0 then
      gfx.set_col(4, 5)
      gfx.set_col(3, 5)
    end
    gfx.draw_sprite(player.spr, player.x, player.y)
    gfx.reset_col()
  notes: []
  aliases:
  - set_col
  seeAlso:
  - gfx.reset_col
  - gfx.screen_col
  since: '1.0'
- name: reset_col
  signature: gfx.reset_col()
  summary: Clear the draw palette remap.
  description: 'Undo every `set_col` remap. Without it the remap stays on for the frames that follow, which is the usual way a whole game turns white by accident. It does not touch `set_color`, `screen_col` or the palette rows.'
  params: []
  returns: null
  examples:
  - |-
    gfx.reset_col()
  notes: []
  aliases:
  - reset_col
  seeAlso:
  - gfx.set_col
  since: '1.0'
- name: set_color
  signature: gfx.set_color(index, hex | r, g, b)
  summary: Change a screen colour at runtime.
  picture: img/frames/gfx-palette.png
  caption: 'The sixteen palette entries; colour 4 redefined to a cyan by set_color, so the row and the box both change; colour 9 drawn as colour 2 by set_col.'
  description: 'Change what one of the sixteen colours shows while the game runs, as `"#rrggbb"` (the `#` may be left out) or as three components `0` to `255`. Only the base palette row changes, so a scanline drawn through another row does not see it. The change applies when the frame is shown, to everything already drawn in it, and stays until `gfx.reset_palette()`. The game''s saved palette is untouched.'
  params:
  - name: index
    type: number
    required: true
    description: 'Palette index, `0` to `15`.'
  - name: hex
    type: string|number
    required: true
    description: 'The colour as `"#rrggbb"`, or, with three numbers, the red component. A single number is read as red alone.'
  - name: g
    type: number
    optional: true
    description: Green 0..255.
  - name: b
    type: number
    optional: true
    description: Blue 0..255.
  returns: null
  examples:
  - |-
    gfx.set_color(4, "#00ffcc")    -- colour 4 is now a cyan
    gfx.set_color(4, 255, 209, 0)  -- and back to the default yellow
  notes:
  - kind: note
    text: 'An unreadable string gives black, without an error.'
  aliases: []
  seeAlso:
  - gfx.get_color
  - gfx.reset_palette
  - gfx.set_palette_row
  since: '2.0'
- name: get_color
  signature: gfx.get_color(index)
  summary: Current screen colour as "#rrggbb".
  description: 'The colour currently shown for a palette index in the base row, as lowercase `"#rrggbb"`. It reflects `set_color` and `screen_col`, not the other palette rows.'
  params:
  - name: index
    type: number
    required: true
    description: Palette index 0..15.
  returns: Colour string "#rrggbb".
  examples:
  - |-
    local sky = gfx.get_color(12)
  notes: []
  aliases: []
  seeAlso:
  - gfx.set_color
  since: '2.0'
- name: reset_palette
  signature: gfx.reset_palette()
  summary: Restore the game palette and clear extra rows.
  description: 'Put the game''s own palette back: every `set_color` is undone, every palette row is a copy of the base palette again, and `screen_col` remaps are gone. It leaves `set_col` and the scanline effects alone. The game stopping does this on its own.'
  params: []
  returns: null
  examples:
  - |-
    -- the end of a fade to black
    local fade = 0
    if fade == 0 then
      gfx.reset_palette()
    end
  notes: []
  aliases: []
  seeAlso:
  - gfx.set_color
  - gfx.set_palette_row
  since: '2.0'
- name: set_palette_row
  signature: gfx.set_palette_row(row, colours)
  summary: Define a screen palette row 0..15 (16 hex strings).
  description: 'Fill one of the sixteen palette rows. Rows `1` to `15` start as copies of the base palette, and a scanline effect picks a row per screen line, a sky gradient or a tinted water band without redrawing anything. Row `0` is the base palette itself.'
  params:
  - name: row
    type: number
    required: true
    description: 'Row `0` to `15`; `0` is the palette everything is drawn with.'
  - name: colours
    type: table
    required: true
    description: 'Up to sixteen `"#rrggbb"` strings; the entries not given keep their colour, extra ones are ignored, and an unreadable string gives black.'
  returns: null
  examples:
  - |-
    gfx.set_palette_row(1, { "#000000", "#1a0810", "#2c1015", "#402512", "#4a3a10", "#606060", "#5a2a3a", "#5a1030", "#301020", "#180028", "#0c1a2a", "#254050", "#405a18", "#0a4a2a", "#003040", "#001020" })
    gfx.scanline_range(0, 60, { palette = 1 })  -- dusk over the top third
  notes: []
  aliases: []
  seeAlso:
  - gfx.scanline
  - gfx.screen_col
  since: '2.0'
- name: screen_col
  signature: gfx.screen_col(from, to[, row])
  summary: Screen palette remap applied at display time.
  description: 'Show one colour as another on the finished frame, after everything is drawn: the colour currently at `to` is copied over `from` in the palette row, and a later change of `to` does not follow. Unlike `set_col` it costs nothing per draw call, and unlike it **it stays** until the row is written again or `gfx.reset_palette()`.'
  params:
  - name: from
    type: number
    required: true
    description: Palette index drawn.
  - name: to
    type: number
    required: true
    description: Palette index shown.
  - name: row
    type: number
    optional: true
    description: Palette row to affect; defaults to the base row.
  returns: null
  examples:
  - |-
    -- a hit flash: every colour 8 shows as white for a few frames
    local hit_timer = 6
    if hit_timer > 0 then
      gfx.screen_col(8, 5)
    else
      gfx.reset_palette()
    end
  notes: []
  aliases: []
  seeAlso:
  - gfx.set_col
  - gfx.set_palette_row
  since: '2.0'
- name: scanline
  signature: gfx.scanline(y, {shift_x=, shift_y=, palette=, wrap=, blank=})
  summary: Per-row display effect.
  picture: img/frames/gfx-scanline.png
  caption: 'Every row shifted by a sine of its position: the map and the sprite wave.'
  description: 'Set the display effect of one screen row: `shift_x` moves it sideways (positive to the right), `shift_y` up or down, `palette` draws it through another palette row, `wrap` makes a sideways shift loop around instead of uncovering colour `0`, `blank` shows it pure black. Options left out keep what the row already had this frame; a row outside `0` to `179` is ignored. The effect applies to the shown frame, HUD included. The effects last one frame, they are forgotten when the frame is shown, unless `gfx.persist_effects(true)`.'
  params:
  - name: y
    type: number
    required: true
    description: Screen row 0..179.
  - name: opts
    type: table
    required: true
    description: 'A table with any of `shift_x`, `shift_y` (pixels), `palette` (row `0` to `15`), `wrap`, `blank` (booleans).'
  returns: null
  examples:
  - |-
    -- heat haze along the horizon
    local t = sys.frame()
    for y = 90, 120 do
      gfx.scanline(y, { shift_x = math.sin((y + t) / 6) * 3, wrap = true })
    end
  notes: []
  aliases: []
  seeAlso:
  - gfx.scanline_range
  - gfx.scanline_fn
  - gfx.reset_scanlines
  since: '2.0'
- name: scanline_range
  signature: gfx.scanline_range(y0, y1, opts)
  summary: Apply the same effect to rows y0..y1.
  description: 'Apply the same effect to every row from `y0` to `y1`, both included: the cheap way to tint or shift a band of the screen. Rows off the screen are skipped, and `y1` below `y0` does nothing.'
  params:
  - name: y0
    type: number
    required: true
    description: First row.
  - name: y1
    type: number
    required: true
    description: Last row.
  - name: opts
    type: table
    required: true
    description: Same options as gfx.scanline.
  returns: null
  examples:
  - |-
    gfx.set_palette_row(2, { "#000000", "#0a1a3a", "#1a2a4a", "#2a3a5a", "#3a4a6a", "#8aa0c0" })
    gfx.scanline_range(120, 179, { palette = 2, shift_x = 1 })  -- an underwater band
  notes: []
  aliases: []
  seeAlso:
  - gfx.scanline
  - gfx.set_palette_row
  since: '2.0'
- name: scanline_fn
  signature: gfx.scanline_fn(fn)
  summary: Call fn(y) for every row once and apply the returned effect.
  description: 'Call a function for every row, `0` to `179`, and apply what it returns as that row''s effect. It runs 180 times per call, so a game that calls it every frame pays for it every frame. Anything but a function is ignored.'
  params:
  - name: fn
    type: function
    required: true
    description: fn(y) -> table|nil, called once per row.
  returns: null
  examples:
  - |-
    local t = sys.frame()
    gfx.scanline_fn(function(y)
      return { shift_x = math.sin((y + t) / 8) * 2 }
    end)
  notes: []
  aliases: []
  seeAlso:
  - gfx.scanline
  - gfx.persist_effects
  since: '2.0'
- name: reset_scanlines
  signature: gfx.reset_scanlines()
  summary: Clear all row effects.
  description: 'Clear every row effect now. Only needed with `gfx.persist_effects(true)`: otherwise the effects go on their own when the frame is shown.'
  params: []
  returns: null
  examples:
  - |-
    gfx.reset_scanlines()
  notes: []
  aliases: []
  seeAlso:
  - gfx.scanline
  since: '2.0'
- name: persist_effects
  signature: gfx.persist_effects(on)
  summary: Keep row effects from one frame to the next.
  description: 'Keep the row effects from one frame to the next instead of forgetting them when each frame is shown. Off by default, so a frame that sets no effects costs nothing. Turning it off does not clear the effects already set: they go when the next frame is shown. `0` counts as off.'
  params:
  - name: 'on'
    type: boolean
    required: true
    description: '`true` to keep the effects; left out, `true`.'
  returns: null
  examples:
  - |-
    function _init()
      gfx.persist_effects(true)
      gfx.scanline_range(0, 40, { palette = 1 })
    end
  notes: []
  aliases: []
  seeAlso:
  - gfx.scanline
  - gfx.reset_scanlines
  since: '2.0'
- name: width
  signature: gfx.width()
  summary: Screen width (320).
  description: Screen width in pixels. Always 320, but read it rather than hard-coding it.
  params: []
  returns: '320.'
  examples:
  - |-
    local middle = gfx.width() // 2
  notes: []
  aliases: []
  seeAlso:
  - gfx.height
  since: '2.0'
- name: height
  signature: gfx.height()
  summary: Screen height (180).
  description: Screen height in pixels. Always 180.
  params: []
  returns: '180.'
  examples:
  - |-
    gfx.fill_rect(0, gfx.height() - 8, gfx.width(), 8, 1)
  notes: []
  aliases: []
  seeAlso:
  - gfx.width
  since: '2.0'
