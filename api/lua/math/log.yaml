name: log
signature: math.log(x[, base])
summary: The logarithm of x, natural or in a given base.
description: 'Returns the logarithm of `x` in `base`, by default e. In base `2`, it says how many times a number can be halved: the depth of a tree, the bits a value needs.'
params:
  - name: x
    type: number
    description: A number above zero.
    required: true
  - name: base
    type: number
    description: The base; left out, e.
    optional: true
returns: The logarithm.
returnType: number
examples:
  - |-
    print(math.log(1024, 2))   --> 10
    print(math.log(100, 10))   --> 2
seeAlso:
  - math.exp
aliases: []
standard: true
manual: https://www.lua.org/manual/5.3/manual.html#pdf-math.log
