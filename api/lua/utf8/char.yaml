name: char
signature: utf8.char(...)
summary: A UTF-8 string made of the characters with the given code points.
description: 'Turns each Unicode code point into its UTF-8 bytes and joins them: `233` is `é`.'
params:
  - name: "..."
    type: number
    description: The code points, one per character.
    optional: true
returns: The string.
returnType: string
examples:
  - |-
    print(utf8.char(72, 233))   --> Hé
seeAlso:
  - utf8.codepoint
  - string.char
aliases: []
standard: true
manual: https://www.lua.org/manual/5.3/manual.html#pdf-utf8.char
