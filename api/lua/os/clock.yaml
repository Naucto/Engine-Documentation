name: clock
signature: os.clock()
summary: Seconds of processor time the game has used.
description: 'Returns a time in seconds that only moves forwards, precise to the millisecond. The difference between two readings measures how long a piece of code took, which is how to find what makes a frame slow.'
params: []
returns: Seconds, a float.
returnType: number
examples:
  - |-
    local start = os.clock()
    local sum = 0
    for i = 1, 1000 do sum = sum + i end
    local ms = (os.clock() - start) * 1000
    print(sum, ms >= 0)   --> 500500 true
seeAlso:
  - sys.fps
aliases: []
standard: true
manual: https://www.lua.org/manual/5.3/manual.html#pdf-os.clock
