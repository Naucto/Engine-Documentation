name: id
description: "The id this player holds in the session, the same id the host receives in
  `peer.joined` / `peer.left` and every peer gets as the `from` of an event, so it is the natural
  key for per-player data in [[net.state]]. It is the player's account id, except for the second
  client of the NET tab's test rig, which runs on your account under an id of its own. It is not a
  seat number from `1` to `max_players`: ids are not contiguous, and an account holds one seat in a
  session."
returns: Your own player id in the session, as an integer.
examples:
  - |-
    -- inside the host or join callback
    print("my id is " .. net.id())
notes: []
seeAlso:
  - net.on
  - net.state
since: "1.0"
