name: join
signature: net.join(callback)
summary: Open the join dialog.
description: >-
  Ask the player to join an existing session by opening the platform's join dialog, where they can
  enter an invite code or browse public sessions.


  As with [[net.host]], the callback fires only on success: if the player cancels the dialog,
  nothing happens. Like [[net.host]], it raises `net: already in a session; call net.leave() first`
  when a session is already active, and silently ignores a repeat call made while a dialog is still
  open. Where the game runs without the platform's network dialogs, the call does nothing at all.
params:
  - name: callback
    type: function
    description: Optional function called once, with no arguments, after the session has been joined.
    optional: true
returns: null
examples:
  - |-
    local state = "menu"
    net.join(function()
      state = "playing"
      print("joined, my id is " .. net.id())
    end)
notes: []
aliases: []
seeAlso:
  - net.host
  - net.leave
since: "1.0"
