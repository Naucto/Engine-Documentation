name: queue
signature: net.queue()
summary: Create a replicated queue value.
description: >-
  Create a shared FIFO queue. All players see the same queue and pops are ordered by the session
  host, so an item is delivered to exactly one popper.


  Like a lock, a queue becomes shared only once it is assigned into [[net.state]]; its path there is
  its identity, and you use it from there:


  - `push(value)` appends any serializable value (numbers, strings, booleans, nested tables).
  Pushing a function raises `net: cannot queue a function`.

  - `pop(callback)` removes the head and delivers it to `callback(value)`. On an empty queue the
  callback receives `nil`. The callback form exists because the head may live on another peer; treat
  the value as arriving "soon" rather than instantly.

  - `length()` and `peek()` read the local replica synchronously.


  A pushed table arrives with its keys as strings, like an event payload. On a path a guest may not
  write, its `push` and its `pop` are refused: `net.on("error")` fires with the path and
  `"forbidden"`, and the `pop` callback still gets `nil`, as on an empty queue.
params: []
returns: "A queue handle: a table with `push`, `pop`, `length` and `peek`."
returnType: table
examples:
  - |-
    -- inside the host callback
    net.state.respawns = net.queue()      -- create the shared queue (host does this once)

    net.state.respawns.push({ coin = 3 }) -- append a value
    net.state.respawns.pop(function(value)  -- remove the head; nil when empty
      if value then
        print("respawn coin " .. value.coin)
      end
    end)
    local n = net.state.respawns.length()  -- current number of items
    local head = net.state.respawns.peek() -- read the head without removing it (nil if empty)
notes:
  - kind: note
    text: "A queue you never assign into `net.state` is a **local** queue: usable without a session, but
      private to this player."
aliases: []
seeAlso:
  - net.lock
  - net.on
since: "1.0"
