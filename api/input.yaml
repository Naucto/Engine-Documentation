namespace: input
title: Input
functions:
- name: held
  signature: input.held(action[, player])
  summary: True while an action (left right up down a b x y pause) is held.
  description: 'True for every step an action is held. Actions are named, not keys: the player decides
    which key or pad button produces them, and your game never has to care. A name that is not an action
    (a typo, `"jump"`) answers `false` without a warning.'
  params:
  - name: action
    type: string
    required: true
    description: One of left right up down a b x y pause.
  - name: player
    type: number
    optional: true
    description: 'Player `1` to `4`; left out, `0` or negative, player `1`. The keyboard and the first gamepad are player 1 together, the second keyboard layout and the second gamepad player 2. A number past `4` answers `false`.'
  returns: True while held.
  returnType: boolean
  examples:
  - |-
    local player = { x = 40, y = 40 }

    function _update()
      if input.held("left") then player.x = player.x - 2 end
      if input.held("right") then player.x = player.x + 2 end
    end
  notes: []
  aliases: []
  seeAlso:
  - input.pressed
  - input.released
  since: '2.0'
- name: pressed
  signature: input.pressed(action[, player])
  summary: True on the step an action was pressed.
  description: True only on the step an action went down - what you want for a jump or a menu choice,
    so holding the button does not repeat it.
  params:
  - name: action
    type: string
    required: true
    description: One of left right up down a b x y pause.
  - name: player
    type: number
    optional: true
    description: 'Player `1` to `4`; left out, `0` or negative, player `1`. The keyboard and the first gamepad are player 1 together, the second keyboard layout and the second gamepad player 2. A number past `4` answers `false`.'
  returns: True on the press step.
  returnType: boolean
  examples:
  - |-
    local player = { vy = 0, on_ground = true }
    if input.pressed("a") and player.on_ground then
      player.vy = -6
    end
  notes: []
  aliases: []
  seeAlso:
  - input.held
  - input.released
  since: '2.0'
- name: released
  signature: input.released(action[, player])
  summary: True on the step an action was released.
  description: True only on the step an action was released. Pair it with `input.pressed` to measure how long
    a button was held.
  params:
  - name: action
    type: string
    required: true
    description: One of left right up down a b x y pause.
  - name: player
    type: number
    optional: true
    description: 'Player `1` to `4`; left out, `0` or negative, player `1`. The keyboard and the first gamepad are player 1 together, the second keyboard layout and the second gamepad player 2. A number past `4` answers `false`.'
  returns: True on the release step.
  returnType: boolean
  examples:
  - |-
    -- variable jump height: cut the rise when the button is let go
    local player = { vy = -6 }
    if input.released("a") and player.vy < 0 then player.vy = player.vy / 2 end
  notes: []
  aliases: []
  seeAlso:
  - input.held
  - input.pressed
  since: '2.0'
- name: key_pressed
  signature: input.key_pressed(key)
  summary: True while a keyboard key (event.key name) is held.
  description: 'True for every step a keyboard key is held, despite the name: the edge is `input.key_down`. Keys are named by the browser''s `event.key` value, so the exact string matters: with Shift held the A key is `"A"`, and the letters follow the keyboard''s layout. Every key is released when the game loses focus.'
  params:
  - name: key
    type: string
    description: Key name from the browser keyboard event.
    required: true
  returns: '`true` if the key is pressed, `false` otherwise.'
  returnType: boolean
  examples:
  - |-
    local speed = 2
    if input.key_pressed("Shift") then speed = 4 end
  notes:
  - kind: warning
    text: '`key_pressed` means held: it stays `true` for as long as the key is down, so a jump or a menu choice read with it repeats every step. Read the press with `input.key_down`.'
  - kind: tip
    text: 'Prefer actions over raw keys: they work with a gamepad and can be rebound.'
  aliases:
  - key_pressed
  seeAlso:
  - input.key_down
  - input.held
  since: '1.0'
- name: key_down
  signature: input.key_down(key)
  summary: True on the step a key went down.
  description: True on the step a key went down, using the browser's event.key names ("a", "Escape", "ArrowLeft").
  params:
  - name: key
    type: string
    required: true
    description: A key name as the browser reports it.
  returns: True on the press step.
  returnType: boolean
  examples:
  - |-
    if input.key_down("r") then print("restart") end
  notes:
  - kind: tip
    text: 'Prefer actions over raw keys: they work with a gamepad and can be rebound.'
  aliases: []
  seeAlso:
  - input.key_pressed
  - input.pressed
  since: '2.0'
- name: get_mouse_pos
  signature: input.get_mouse_pos()
  summary: Mouse x, y in screen pixels (nil when outside).
  description: 'Mouse position in screen pixels, or `nil` when the pointer is outside the screen. The camera does not apply: to aim at the world, add the camera offset you keep in a variable.'
  params: []
  returns: x, y in screen pixels, or nil.
  returnType: number|nil
  examples:
  - |-
    local cam = { x = 0, y = 0 }   -- what gfx.camera was last given
    local mx, my = input.get_mouse_pos()
    if mx then gfx.draw_sprite(4, cam.x + mx - 4, cam.y + my - 4) end
  notes: []
  aliases: []
  seeAlso:
  - input.mouse_pressed
  - input.mouse_down
  since: '2.0'
- name: mouse_pressed
  signature: input.mouse_pressed([button])
  summary: True while a mouse button is held.
  description: 'True for every step a mouse button is held, despite the name: the edge is `input.mouse_down`. `0` is the left button, `1` the right, `2` the middle.'
  params:
  - name: button
    type: number
    optional: true
    description: 'Button `0` (left), `1` (right) or `2` (middle); left out, `0`.'
  returns: True while held.
  returnType: boolean
  examples:
  - |-
    local mx, my = input.get_mouse_pos()
    if mx and input.mouse_pressed() then gfx.pixel(mx, my, 5) end
  notes:
  - kind: warning
    text: '`mouse_pressed` means held, like `key_pressed`: a click is `input.mouse_down`.'
  aliases: []
  seeAlso:
  - input.mouse_down
  - input.get_mouse_pos
  since: '2.0'
- name: mouse_down
  signature: input.mouse_down([button])
  summary: True on the step a mouse button was pressed.
  description: 'True only on the step a mouse button went down. `0` is the left button, `1` the right, `2` the middle.'
  params:
  - name: button
    type: number
    optional: true
    description: 'Button `0` (left), `1` (right) or `2` (middle); left out, `0`.'
  returns: True on the press step.
  returnType: boolean
  examples:
  - |-
    if input.mouse_down() then
      local mx, my = input.get_mouse_pos()
      if mx then map.set(mx // 8, my // 8, 1) end
    end
  notes: []
  aliases: []
  seeAlso:
  - input.mouse_pressed
  - input.get_mouse_pos
  since: '2.0'
- name: players
  signature: input.players()
  summary: Number of connected players (keyboard counts as one).
  description: 'How many players have a controller. The keyboard and the first gamepad are one player together; a second gamepad is player 2, and so on. A second keyboard layout (J, L, I, K…) plays as player 2 without counting here.'
  params: []
  returns: Player count, at least 1.
  returnType: number
  examples:
  - |-
    for p = 1, input.players() do
      if input.pressed("a", p) then print("player " .. p .. " fires") end
    end
  notes: []
  aliases: []
  seeAlso:
  - input.held
  - net.id
  since: '2.0'
values: []
