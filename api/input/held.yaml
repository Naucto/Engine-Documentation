name: held
description: 'True for every step an action is held. An action is a name the game gives to something
  a player does, and the keys and gamepad controls that press it are set in the GAME tab: the code
  never reads a key. A name the game does not have (a typo, an action renamed since) answers `false`
  without a warning.'
params:
  action: The name of one of the game's actions, as the GAME tab lists it. A new game has `"left"`,
    `"right"`, `"up"`, `"down"`, `"a"`, `"b"`, `"x"`, `"y"` and `"pause"`.
  player: Player `1` to `4`; left out, `0` or negative, player `1`. The keyboard and the first gamepad
    are player 1 together, the keys given to player 2 and the second gamepad player 2. A number past
    `4` answers `false`.
returns: True while held.
examples:
  - |-
    local player = { x = 40, y = 40 }

    function _update()
      if input.held("left") then player.x = player.x - 2 end
      if input.held("right") then player.x = player.x + 2 end
    end
notes: []
seeAlso:
  - input.pressed
  - input.released
since: "2.0"
