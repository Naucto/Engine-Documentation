name: released
signature: input.released(action[, player])
summary: True on the step an action was released.
description: True only on the step an action was released. Pair it with [[input.pressed]] to measure
  how long a button was held.
params:
  - name: action
    type: string
    required: true
    description: One of `"left"`, `"right"`, `"up"`, `"down"`, `"a"`, `"b"`, `"x"`, `"y"`, `"pause"`.
  - name: player
    type: number
    optional: true
    description: Player `1` to `4`; left out, `0` or negative, player `1`. The keyboard and the first
      gamepad are player 1 together, the second keyboard layout and the second gamepad player 2. A
      number past `4` answers `false`.
returns: True on the release step.
returnType: boolean
examples:
  - |-
    -- variable jump height: cut the rise when the button is let go
    local player = { vy = -6 }
    if input.released("a") and player.vy < 0 then player.vy = player.vy / 2 end
notes: []
aliases: []
seeAlso:
  - input.held
  - input.pressed
since: "2.0"
