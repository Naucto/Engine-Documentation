name: set_col
picture: ../img/frames/gfx-set-col.png
caption: The same sprite plain, with its yellow drawn as white by set_col(4, 5), and plain again
  after reset_col.
description: "Draw one colour as another, from this call on: sprites, shapes, the map and text all
  follow, [[gfx.clear]] does not. It holds until `gfx.reset_col()`, across frames too, so reset it
  before the next thing you draw plain. A sprite's transparent colour stays transparent whatever it
  is mapped to."
params:
  from: Palette slot to replace.
  to: Palette slot to copy into it.
returns: null
examples:
  - |-
    -- flash the player white while hit
    local player = { spr = 1, x = 40, y = 40, hit_timer = 6 }
    if player.hit_timer > 0 then
      gfx.set_col(4, 5)
      gfx.set_col(3, 5)
    end
    gfx.draw_sprite(player.spr, player.x, player.y)
    gfx.reset_col()
notes: []
seeAlso:
  - gfx.reset_col
  - gfx.screen_col
since: "1.0"
