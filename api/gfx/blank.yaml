name: blank
picture: ../img/frames/gfx-blank.png
caption: "A letterbox: gfx.blank() on line 0 and again on line 160, gfx.blank(false) on line 20, so
  the picture shows between them."
description: >-
  Show black in place of the picture, which stays drawn underneath.


  Called anywhere but `_scanline`, it blanks the **whole frame** and stays until `gfx.blank(false)`:
  a cut to black that costs nothing to draw.


  Called inside `_scanline(y)`, it blanks **line `y` and the lines below it** for this frame, until
  `gfx.blank(false)` on a later line: a letterbox is a `blank()` on the first line and a
  `blank(false)` where the picture starts.
params:
  on: "`false` to show the picture again; left out, `true`."
returns: null
examples:
  - |-
    -- a letterbox: black above line 20 and from line 160 down
    function _draw()
      gfx.clear(12)
      gfx.fill_circle(160, 90, 30, 4)
    end

    function _scanline(y)
      if y == 0 then gfx.blank() end
      if y == 20 then gfx.blank(false) end
      if y == 160 then gfx.blank() end
    end
notes: []
seeAlso:
  - gfx.shift
  - gfx.clear
since: "2.0"
