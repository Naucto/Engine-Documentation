name: clip
picture: ../img/frames/gfx-clip.png
caption: A full-screen fill and a row of circles, only visible inside the clip rectangle, outlined
  in pink (colour 6) once the clip is reset.
description: Keep every later draw call inside a rectangle of the screen; the rectangle is in screen
  pixels, the camera does not move it. `gfx.clip()` draws to the whole screen again. A new clip
  replaces the old one, it stays from one frame to the next, and [[gfx.clear]] ignores it.
params:
  x: Left edge.
  y: Top edge.
  w: Width.
  h: Height.
returns: null
examples:
  - |-
    local hp = 3
    gfx.clip(0, 0, 320, 120)  -- the play field
    map.draw(0, 0)
    gfx.clip()                -- the HUD over everything
    gfx.print("HP " .. hp, 4, 168, 5)
notes:
  - kind: warning
    text: "All four numbers or none: `gfx.clip(x)` sets the missing ones to `0`, a rectangle nothing
      fits in, and so does a negative width or height. The screen then stays blank until
      `gfx.clip()`."
seeAlso:
  - gfx.camera
since: "2.0"
