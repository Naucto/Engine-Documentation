name: get_pixel
signature: gfx.get_pixel(x, y)
summary: Read the palette index at a screen pixel (slow).
description: "Read the palette index at a position, in the same coordinates the drawing calls use:
  the camera applies. Off screen it answers `0`. It reads what was drawn, after any `set_col` remap
  and before the display effects."
params:
  - name: x
    type: number
    required: true
    description: Horizontal position, before the camera offset.
  - name: y
    type: number
    required: true
    description: Vertical position, before the camera offset.
returns: Palette index 0..15.
returnType: number
examples:
  - |-
    -- treat colour 2 as solid ground
    local player = { x = 40, y = 60, vy = 1 }
    if gfx.get_pixel(player.x, player.y + 8) == 2 then
      player.vy = 0
    end
notes:
  - kind: warning
    text: "Slow: it pulls the frame back from the GPU. Read what you need once a frame, never in a loop
      over pixels."
aliases: []
seeAlso:
  - gfx.pixel
  - map.flag
since: "2.0"
