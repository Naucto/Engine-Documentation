name: frame
description: "The number of steps the game has taken: `0` in `_init`, `1` on the first `_update`. It
  counts fixed steps, not frames shown, and stops while the game is paused."
returns: Frame count.
examples:
  - |-
    -- four-frame walk cycle, one frame every 8 steps
    local player = { sprite = 4 }
    player.sprite = 4 + (sys.frame() // 8) % 4
notes: []
seeAlso:
  - sys.time
  - sys.dt
since: "2.0"
