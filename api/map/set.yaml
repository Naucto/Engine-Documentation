name: set
signature: map.set(tx, ty, n[, m])
summary: Change a tile of map m (the first by default) for this run only.
picture: ../img/frames/map-set.png
caption: "The same window of the map before and after map.set(9, 26, 0): the outlined tile of the
  platform is gone on the right."
description: Change a tile for the rest of this run. The edit lives in memory only, the saved map is
  untouched, and reloading the game brings the level back. Out of the map the call does nothing; on
  a map the game does not have it does nothing either, with a warning in the console.
params:
  - name: tx
    type: number
    required: true
    description: Tile column, from `0` to `map.width() - 1`.
  - name: ty
    type: number
    required: true
    description: Tile row, from `0` to `map.height() - 1`.
  - name: n
    type: number
    required: true
    description: Sprite index to place, 0 for empty.
  - name: m
    type: number
    description: Which map, counted from `1` in the order of the MAP tab's strip. Defaults to the first.
    optional: true
returns: null
examples:
  - |-
    -- open the door once the key is taken
    map.set(24, 9, 0)
notes: []
aliases: []
seeAlso:
  - map.get
  - map.draw
since: "2.0"
