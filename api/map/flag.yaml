name: flag
description: "Read the flags the ART tab stores on a sprite: eight bits the engine never reads,
  whose meaning is yours (bit `0` solid, bit `2` water). Without `bit` it is the whole byte, `0` to
  `255`; with it, `true` or `false`. Only the first sheet's flags are read: a sprite on another
  sheet, or past the end, answers `0` (`false` with `bit`), without an error. The usual pattern
  reads a tile with [[map.get]] and asks its sprite."
params:
  n: Sprite index in the sprite sheet. A new game has 256 of them, numbered from `0`; a larger sheet
    has more.
  bit: Optional bit index from `0` to `7`.
returns: The full flag value when `bit` is omitted, or `true`/`false` for a single bit.
examples:
  - |-
    local tile_sprite = map.get(4, 6)

    if map.flag(tile_sprite, 0) then
      print("solid")  -- bit 0 is set on that sprite
    end

    local flags = map.flag(tile_sprite)  -- the whole byte, 0 to 255
notes: []
seeAlso:
  - map.get
  - gfx.get_pixel
since: "1.0"
