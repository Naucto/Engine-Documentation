namespace: net
title: Networking
functions:
- name: host
  signature: net.host([config, callback])
  summary: 'Open the host dialog; callback() once the session exists.'
  description: 'Ask the player to create (host) a new session by opening the platform''s host dialog.


    Both arguments are optional, and `net.host(callback)` is also accepted. The `config` table supports
    two keys; any other key is ignored:


    | Key | Type | Meaning |

    |----|----|----|

    | `max_players` | number | Session capacity, **including the host**. Defaults to `2`, and is neither
    rounded nor capped by the engine. The player cannot change it -- capacity belongs to the game. |

    | `title` | string | Default session title offered in the dialog. The player can edit it. |


    The callback fires only when the session is actually created. If the player cancels the dialog, the
    callback is never called and no session starts -- design your game so it simply stays in its menu
    state in that case.


    Raises `net: already in a session; call net.leave() first` if a session is active. A second call made
    while a host/join dialog is still open is silently ignored (a no-op), not an error. Where the game
    runs without the platform''s network dialogs, the call does nothing at all.'
  params:
  - name: config
    type: table
    description: Optional session settings (see below).
    optional: true
  - name: callback
    type: function
    description: Optional function called once, with no arguments, when the session has been created.
    optional: true
  returns: null
  examples:
  - |-
    local state = "menu"
    net.host({ max_players = 4, title = "Tag arena" }, function()
      state = "playing"
      print("session created, my id is " .. net.id())
    end)
  notes:
  - kind: warning
    text: 'While the dialog is open a repeat call is ignored, but once the session is created an unconditional
      `net.host` from `_update()` raises `net: already in a session` on the very next frame. Guard it
      so it runs once, for example by switching to a `"waiting"` state before the call.'
  aliases: []
  seeAlso:
  - net.join
  - net.leave
  - net.id
  since: '1.0'
- name: join
  signature: net.join(callback)
  summary: Open the join dialog.
  description: 'Ask the player to join an existing session by opening the platform''s join dialog, where
    they can enter an invite code or browse public sessions.


    As with [[net.host]], the callback fires only on success: if the player cancels the dialog, nothing
    happens. Like [[net.host]], it raises `net: already in a session; call net.leave() first` when a session
    is already active, and silently ignores a repeat call made while a dialog is still open. Where the game
    runs without the platform''s network dialogs, the call does nothing at all.'
  params:
  - name: callback
    type: function
    description: Optional function called once, with no arguments, after the session has been joined.
    optional: true
  returns: null
  examples:
  - |-
    local state = "menu"
    net.join(function()
      state = "playing"
      print("joined, my id is " .. net.id())
    end)
  notes: []
  aliases: []
  seeAlso:
  - net.host
  - net.leave
  since: '1.0'
- name: leave
  signature: net.leave()
  summary: Leave the current session.
  description: 'Leave the current session and tear it down. Safe to call when there is no session (it does
    nothing). After leaving, the game may host or join again. Your own `"ended"` callback does not fire:
    only the other players get it, and only when the one leaving is the host.'
  params: []
  returns: null
  examples:
  - |-
    local game_over = true
    if game_over then
      net.leave()
      state = "menu"
    end
  notes: []
  aliases: []
  seeAlso:
  - net.host
  - net.join
  since: '1.0'
- name: id
  signature: net.id()
  summary: Your player id in the session.
  description: 'The id of this player''s account, the same id the host receives in `peer.joined` / `peer.left` and every peer gets as the `from` of an event, so it is the natural key for per-player data in [[net.state]]. It is not a seat number from `1` to `max_players`: ids are large, not contiguous, and two windows on one account share one.'
  params: []
  returns: Your own player id in the session, as an integer.
  examples:
  - |-
    print("my id is " .. net.id())
  notes: []
  aliases: []
  seeAlso:
  - net.on
  - net.state
  since: '1.0'
- name: 'on'
  signature: net.on(pattern, callback)
  summary: React to net.state changes or events.
  description: 'Register a callback for a network event. It needs a session, so call it from the host or
    join callback, not from `_init`. What arrives depends on the pattern:


    | Pattern | Callback arguments | Fires when |

    |----|----|----|

    | `"peer.joined"` | `(playerId)` | A player joins the session. **Host only**: a guest is not told about the other guests |

    | `"peer.left"` | `(playerId)` | A player leaves or disconnects. **Host only** |

    | `"ended"` | *(none)* | The session ends -- in particular when the host leaves |

    | `"event:<name>"` | `(from, payload)` | A peer calls `net.emit("<name>", payload)`; `from` is its
    player id |

    | `"error"` | `(path, reason)` | The host refuses one of your writes and rolls it back, or refuses a lock
    acquire, a queue push or a queue pop. **Guest only**; `reason` is `"forbidden"` (the path is not writable
    by guests) or `"conflict"` (another write got there first) |

    | anything else (a state path) | `(path, newValue)` | A matching [[net.state]] key \| changes |


    State patterns match dotted key paths and support two wildcards: `*` matches exactly one path segment,
    `**` matches any number of segments. Change callbacks fire only when the value actually changes (rewriting
    an identical value is silent), and they fire for your own writes too. The names above are reserved:
    `net.on("error", ...)` always registers the rejection listener, so it never observes a [[net.state]]
    key literally named `error`. Listening for `"error"` is the intended way to detect a write the host
    rolled back; the [permissions](/learn/tutorials/permissions) tutorial shows that rejected-write behavior
    in action, there observed via the protected value flipping back. A lock acquire, a queue push or a queue
    pop refused by the permissions fires `"error"` too, with the path and `"forbidden"`: a refused acquire''s
    callback never runs, and a refused pop''s callback gets `nil`.'
  params:
  - name: pattern
    type: string
    description: A reserved name from the table above, an `event:<name>` subscription, or a dotted
      [[net.state]] key path, where `*` matches one segment and `**` any number.
    required: true
  - name: callback
    type: function
    description: Called with the arguments the table above gives for that pattern.
    required: true
  returns: null
  examples:
  - |-
    net.on("score", function(path, value)
      print("score is now " .. value)
    end)

    net.on("players.*.x", function(path, value)
      -- fires for players.7.x but not for players.7.inventory.gold
    end)

    net.on("players.**", function(path, value)
      -- fires for any change anywhere under players
    end)

    net.on("event:serve", function(from, payload)
      print("serve from " .. from .. " towards " .. payload.direction)
    end)

    net.on("peer.left", function(playerId)  -- on the host only
      if net.state.players then net.state.players[playerId] = nil end
    end)
  notes:
  - kind: note
    text: An error raised inside a `net.on` callback (or a lock/queue callback) is printed to the output
      panel but does **not** stop the game.
  aliases: []
  seeAlso:
  - net.emit
  - net.id
  since: '1.0'
- name: emit
  signature: net.emit(name[, payload])
  summary: Broadcast an event.
  description: 'Send a one-shot event to the **other** players in the session. The sender does not receive its own event: if the sender needs the same effect, apply it locally after emitting. A table arrives with its keys as strings, so `{10, 20}` is read back as `payload["1"]`, `payload["2"]`.'
  params:
  - name: name
    type: string
    description: Event name; receivers subscribe with `net.on("event:" .. name, ...)`.
    required: true
  - name: payload
    type: any
    description: Optional value to send along -- a number, string, boolean, or nested table. Functions
      cannot be sent. Omitted, the receivers get `nil`.
    optional: true
  returns: null
  examples:
  - |-
    net.emit("serve", { direction = -1 })
  notes: []
  aliases: []
  seeAlso:
  - net.on
  since: '1.0'
- name: lock
  signature: net.lock()
  summary: Create a replicated lock value.
  description: 'Create a mutual-exclusion lock. Locks let players compete for something safely -- only
    one peer at a time can hold a given lock, no matter how simultaneously they ask.


    **Put the lock in** [[net.state]] **to share it.** A lock becomes shared and host-serialized only
    once it is assigned into `net.state`; its net.state path is its identity, and you use it straight
    from there. Store it right next to what it protects:


    - `acquire(fn)` requests the lock. When granted, `fn` is called with a single argument: a `release`
    function that frees the lock. If the lock is busy, the request waits in a first-come, first-served
    queue and `fn` runs later, when the current holder releases.

    - `is_locked()` returns `true` while any peer holds the lock.


    Requests are ordered by the session host, so two peers acquiring "at the same time" are serialized
    -- one runs, then the other. If a peer disconnects while holding locks, its locks are released automatically
    and its pending requests are dropped. A lock stored under a host-only path (see [permissions](/learn/tutorials/permissions))
    can only be acquired by the host, just like a write to that path: a guest''s `acquire` there is refused,
    its callback never runs, and `net.on("error")` fires with the path and `"forbidden"`.'
  params: []
  returns: A lock handle -- a table with an `acquire` and an `is_locked` function.
  examples:
  - |-
    net.state.score_lock = net.lock()   -- the host creates the shared lock once
    
    net.state.score_lock.acquire(function(release)
      -- nobody else holds the lock in here
      net.state.score = (net.state.score or 0) + 1
      release()
    end)
  notes:
  - kind: note
    text: 'A lock you never assign into `net.state` is a **local** lock: usable without a session, but
      private to this player and uncontended (it grants immediately, even while it is already held). It
      exists so the same code runs in single-player and multiplayer.'
  - kind: warning
    text: Nothing prevents a peer from writing a lock-protected [[net.state]] key without acquiring the
      lock first. A lock only protects against peers that also use it.
  aliases: []
  seeAlso:
  - net.queue
  - net.on
  since: '1.0'
- name: queue
  signature: net.queue()
  summary: Create a replicated queue value.
  description: 'Create a shared FIFO queue. All players see the same queue and pops are ordered by the
    session host, so an item is delivered to exactly one popper.


    Like a lock, a queue becomes shared only once it is assigned into [[net.state]]; its net.state path
    is its identity, and you use it from there:


    - `push(value)` appends any serializable value (numbers, strings, booleans, nested tables). Pushing
    a function raises `net: cannot queue a function`.

    - `pop(callback)` removes the head and delivers it to `callback(value)`. On an empty queue the callback
    receives `nil`. The callback form exists because the head may live on another peer; treat the value
    as arriving "soon" rather than instantly.

    - `length()` and `peek()` read the local replica synchronously.


    A pushed table arrives with its keys as strings, like an event payload. On a path a guest may not
    write, its `push` and its `pop` are refused: `net.on("error")` fires with the path and `"forbidden"`,
    and the `pop` callback still gets `nil`, as on an empty queue.'
  params: []
  returns: A queue handle -- a table with `push`, `pop`, `length` and `peek`.
  examples:
  - |-
    net.state.respawns = net.queue()      -- create the shared queue (host does this once)

    net.state.respawns.push({ coin = 3 }) -- append a value
    net.state.respawns.pop(function(value)  -- remove the head; nil when empty
      if value then
        print("respawn coin " .. value.coin)
      end
    end)
    local n = net.state.respawns.length()  -- current number of items
    local head = net.state.respawns.peek() -- read the head without removing it (nil if empty)
  notes:
  - kind: note
    text: 'A queue you never assign into `net.state` is a **local** queue: usable without a session, but
      private to this player.'
  aliases: []
  seeAlso:
  - net.lock
  - net.on
  since: '1.0'
values:
- name: state
  signature: net.state
  summary: A table shared by every player in the session. Writes replicate to all peers automatically;
    reads always return the latest replicated value.
  description: 'A table shared by every player in the session. Writes replicate to all peers; reads answer the latest replicated value. A player who joins mid-game receives everything they may read. Stored values are numbers, strings, booleans and nested tables; a function raises `net: cannot store a function`. Reading it outside a session raises `net: no active session`.'
  params: []
  returns: null
  examples:
  - |-
    net.state.score = 0                          -- write a value
    net.state.ball = { x = 160, y = 90, dx = 2 } -- assign a whole table at once
    net.state.ball.x = 42                        -- update a nested field
  - |-
    local me = net.id()
    local entry = { x = 24, y = 40 }
    if net.state.players then
      net.state.players[me] = entry
    else
      net.state.players = { [me] = entry }
    end
  notes:
  - kind: note
    text: 'What a joined player may read or write is decided per path in the NET tab, and applied by the host: a refused write is undone on the peer that made it, and its `net.on("error")` fires with the reason `"forbidden"`, or `"conflict"` when another write got there first. A guest''s write is applied locally at once and confirmed or undone afterwards.'
  aliases: []
  since: '1.0'
