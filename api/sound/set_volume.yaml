name: set_volume
description: "Sets the mixer levels, each `0` to `1`: `music` and `sfx` left out keep their value,
  `master` left out is `1`. Pass `master` alone to duck everything, or all three to balance music
  against effects. A level above `1` is not refused: the mix is soft-clipped, so it gets louder and
  rounder rather than breaking up. The levels survive `sound.stop()`."
params:
  master: Overall level 0..1; left out, `1`.
  music: Music level 0..1.
  sfx: Sound effect level 0..1.
returns: null
examples:
  - |-
    -- half volume while the pause menu is up
    local paused = true
    sound.set_volume(paused and 0.5 or 1)
notes: []
seeAlso:
  - sound.play_music
  - sound.stop
since: "2.0"
