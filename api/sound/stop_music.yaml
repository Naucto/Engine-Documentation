name: stop_music
description: Stop the music, at once or over a fade. During the fade `sound.music_pos()` still
  answers, until the fade ends.
params:
  fade_out: Seconds to fade the music down over. Defaults to `0`, which stops it at once.
returns: null
examples:
  - |-
    if input.pressed("pause") then
      sound.stop_music(0.5)
    end
notes: []
seeAlso:
  - sound.play_music
  - sound.stop
since: "1.0"
