name: set_pattern
description: >-
  Change the length of a pattern **for this run only**: the SOUND tab and the saved game keep
  theirs. On the music it takes effect at once, even while the pattern plays: every block of the
  pattern lasts the new length, and notes past it are not played. The blocks after it stay where
  the SOUND tab put them, so a shorter pattern leaves a silence and a longer one plays over the
  next block. Calling it again adds to what it set before. The tempo belongs to the music: set it
  with [[sound.set_music]]; a `bpm` given here warns once and changes nothing.


  | Field | What it is | Range |

  | --- | --- | --- |

  | `steps` | Length, in steps, four to a beat | `1` to `128` |
params:
  n: The pattern's number, as the pattern menu of the SOUND tab shows it. A number no pattern has
    warns once and changes nothing.
  fields: "`steps`."
returns: null
examples:
  - |-
    -- the last lap plays only the first bar of pattern 3
    function last_lap()
      sound.set_pattern(3, { steps = 16 })
    end
notes: []
seeAlso:
  - sound.play_music
  - sound.set_instrument
  - sound.set_music
since: "2.0"
