name: music_pos
description: "Where the music has got to: the bar now sounding, counted from `0`, and the beat inside
  that bar, `0` to `3`. Both are `nil` when nothing plays. The value comes back from the audio thread
  a frame or two late, and a beat lasts many frames, so a test like `beat == 0` is true for a few
  frames in a row: fine for a beat light, late for anything that must land on the beat."
returns: bar, beat, or nil.
examples:
  - |-
    -- a beat light: lit on the first beat of every bar
    local pulse = 0
    local bar, beat = sound.music_pos()
    if beat == 0 then pulse = 1 end
notes: []
seeAlso:
  - sound.play_music
  - sound.is_playing
since: "2.0"
