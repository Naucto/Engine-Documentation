name: stop_note
description: Releases a voice, letting its envelope fade out. Use it for notes started with a length
  of `0`; it releases a voice the music is using just the same.
params:
  channel: Voice 0..4.
returns: null
examples:
  - |-
    sound.play_note("Pad", "A3", 0, 0.6, 2)  -- held on voice 2
    -- ... later
    sound.stop_note(2)
notes: []
seeAlso:
  - sound.play_note
  - sound.is_playing
since: "2.0"
