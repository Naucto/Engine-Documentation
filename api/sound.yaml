namespace: sound
title: Sound
functions:
- name: play_sfx
  signature: sound.play_sfx(slot[, channel, pitch_offset, volume])
  summary: Play SFX slot 0..15.
  description: Plays one of the sixteen SFX slots from the sound editor. Sound effects take the last voice
    first and steal the oldest one when they need another, so music keeps playing underneath.
  params:
  - name: slot
    type: number
    required: true
    description: SFX slot 0..15.
  - name: channel
    type: number
    required: false
    description: Force a voice 0..4 instead of letting the mixer choose.
  - name: pitch_offset
    type: number
    required: false
    description: Semitones to transpose by.
  - name: volume
    type: number
    required: false
    description: 0..1, default 1.
  returns: null
  examples:
  - |-
    if input.btnp("a") then sound.play_sfx(0) end
    -- same jump, a fifth higher
    sound.play_sfx(0, nil, 7)
  notes: []
  aliases: []
  seeAlso:
  - sound.play_note
  - sound.stop
  - sound.set_volume
  since: '2.0'
- name: play_note
  signature: sound.play_note(instrument, pitch[, length, volume, channel])
  summary: Play a note now; pitch is MIDI or "C4".
  description: Plays a single note on an instrument right now, without going through a pattern. Pitch
    is a MIDI number or a note name like "C4".
  params:
  - name: instrument
    type: string|number
    required: true
    description: Instrument id or index from the sound editor.
  - name: pitch
    type: number|string
    required: true
    description: MIDI note or name such as "C4".
  - name: length
    type: number
    required: false
    description: Seconds to hold; omit to sustain until sound.stop_note.
  - name: volume
    type: number
    required: false
    description: 0..1, default 1.
  - name: channel
    type: number
    required: false
    description: Force a voice 0..4.
  returns: null
  examples:
  - |-
    -- a two-note pickup jingle
    sound.play_note("lead", "C5", 0.08)
    sound.play_note("lead", "G5", 0.12)
  notes: []
  aliases: []
  seeAlso:
  - sound.stop_note
  - sound.play_sfx
  since: '2.0'
- name: stop_note
  signature: sound.stop_note(channel)
  summary: Release a voice.
  description: Releases a voice, letting its envelope fade out. Use it for notes started without a length.
  params:
  - name: channel
    type: number
    required: true
    description: Voice 0..4.
  returns: null
  examples:
  - |-
    sound.play_note("pad", "A3", nil, 0.6, 2)
    -- ... later
    sound.stop_note(2)
  notes: []
  aliases: []
  seeAlso:
  - sound.play_note
  - sound.is_playing
  since: '2.0'
- name: play_music
  signature: sound.play_music(song[, loop, fade_in])
  summary: Start song slot 0..15 from the tracker.
  description: 'Play a music slot from the Sound Editor.


    When `song` is omitted, slot `0` plays.


    If the project has no sound data, the call is a silent no-op -- nothing plays and no error is raised.'
  params:
  - name: song
    type: number
    description: Optional zero-based music slot index. `0` plays the first Sound Editor slot, `1` plays
      the second slot, and so on.
    optional: true
  - name: loop
    type: boolean
    description: Whether the song restarts when it reaches the end. Defaults to `true`.
    optional: true
  - name: fade_in
    type: number
    description: Seconds to fade the music up over. Defaults to `0`, which starts at full volume.
    optional: true
  returns: null
  examples:
  - |-
    function _init()
      sound.play_music(0)  -- play Sound Editor slot 1
    end
  notes: []
  aliases:
  - play_music
  seeAlso:
  - sound.stop_music
  - sound.music_position
  since: '1.0'
- name: stop_music
  signature: sound.stop_music([fade_out])
  summary: Stop the music.
  description: Stop the current music playback.
  params:
  - name: fade_out
    type: number
    description: Seconds to fade the music down over. Defaults to `0`, which stops it at once.
    optional: true
  returns: null
  examples:
  - |-
    if input.key_pressed(" ") then
      sound.stop_music()
    end
  notes: []
  aliases:
  - stop_music
  seeAlso:
  - sound.play_music
  - sound.stop
  since: '1.0'
- name: stop
  signature: sound.stop()
  summary: Stop everything.
  description: 'Stops everything at once: music, sound effects and any held notes.'
  params: []
  returns: null
  examples:
  - |-
    function game_over()
      sound.stop()
    end
  notes: []
  aliases: []
  seeAlso:
  - sound.stop_music
  - sound.stop_note
  since: '2.0'
- name: set_volume
  signature: sound.set_volume(master[, music, sfx])
  summary: Mixer levels 0..1.
  description: Sets the mixer levels, each 0..1. Pass master alone to duck everything, or all three to
    balance music against effects.
  params:
  - name: master
    type: number
    required: true
    description: Overall level 0..1.
  - name: music
    type: number
    required: false
    description: Music level 0..1.
  - name: sfx
    type: number
    required: false
    description: Sound effect level 0..1.
  returns: null
  examples:
  - |-
    -- half volume while the pause menu is up
    sound.set_volume(paused and 0.5 or 1)
  notes: []
  aliases: []
  seeAlso:
  - sound.play_music
  - sound.stop
  since: '2.0'
- name: music_position
  signature: sound.music_position()
  summary: pattern_index, step of the playing song (nil when stopped).
  description: 'Where the song has got to: the index of the playing pattern and the step inside it. Returns
    nil when no music is playing - useful for syncing animation to the beat.'
  params: []
  returns: pattern_index, step, or nil.
  examples:
  - |-
    local pattern, step = sound.music_position()
    if step and step % 4 == 0 then pulse = 1 end
  notes: []
  aliases: []
  seeAlso:
  - sound.play_music
  - sound.is_playing
  since: '2.0'
- name: is_playing
  signature: sound.is_playing(channel)
  summary: Whether a voice is sounding.
  description: Whether a given voice is currently sounding.
  params:
  - name: channel
    type: number
    required: true
    description: Voice 0..4.
  returns: True while the voice sounds.
  examples:
  - |-
    if not sound.is_playing(4) then sound.play_sfx(3, 4) end
  notes: []
  aliases: []
  seeAlso:
  - sound.play_note
  - sound.music_position
  since: '2.0'
values: []
