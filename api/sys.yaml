namespace: sys
title: System
functions:
- name: dt
  signature: sys.dt()
  summary: Fixed step length in seconds (1/60).
  description: 'Length of one fixed step in seconds, always 1/60. The console runs `_update` at a fixed rate, so there is nothing to scale by: speeds are written per step. `sys.dt` tells you how long a step is, for a clock or a timer that counts in seconds.'
  params: []
  returns: 1/60.
  examples:
  - |-
    -- a ten-second countdown, one step's worth per _update
    local time_left = 10
    function _update()
      time_left = time_left - sys.dt()
    end
  notes: []
  aliases: []
  seeAlso:
  - sys.time
  - sys.frame
  since: '2.0'
- name: frame
  signature: sys.frame()
  summary: Frames since _init.
  description: 'The number of steps the game has taken: `0` in `_init`, `1` on the first `_update`. It counts fixed steps, not frames shown, and stops while the game is paused.'
  params: []
  returns: Frame count.
  examples:
  - |-
    -- four-frame walk cycle, one frame every 8 steps
    local player = { sprite = 4 }
    player.sprite = 4 + (sys.frame() // 8) % 4
  notes: []
  aliases: []
  seeAlso:
  - sys.time
  - sys.dt
  since: '2.0'
- name: time
  signature: sys.time()
  summary: Seconds since _init.
  description: Seconds elapsed since _init, counted in fixed steps so it never drifts from the game's
    own clock.
  params: []
  returns: Seconds since _init.
  examples:
  - |-
    local bob = math.sin(sys.time() * 3) * 2
  notes: []
  aliases: []
  seeAlso:
  - sys.frame
  - sys.dt
  since: '2.0'
- name: fps
  signature: sys.fps()
  summary: Measured frames per second.
  description: 'Frames per second actually being shown, averaged over the last sixty frames, so a fraction like `59.8`; it is `0` on the very first frames. The editor shows the same number beside the screen.'
  params: []
  returns: Measured frames per second.
  examples:
  - |-
    gfx.print(math.floor(sys.fps()) .. " FPS", 2, 2, 5)
  notes: []
  aliases: []
  seeAlso:
  - sys.frame
  since: '2.0'
- name: log
  signature: sys.log(...)
  summary: Write to the console (same as print).
  description: 'Write a line to the console under the viewer. Values are turned into text and joined with tabs: `nil` prints `nil`, a boolean `true` or `false`, a function `function`, and a table is written as JSON, with its keys as strings. `print` is the same function. The console keeps the last 2000 lines.'
  params:
  - name: '...'
    type: any
    description: One or more values to write.
    required: true
  returns: null
  examples:
  - |-
    local player = { x = 40, y = 40, hp = 3, on_ground = true }
    local score = 0
    print("player", player.x, player.y)
    print("health:", player.hp, "score:", score)
    print("on_ground:", player.on_ground)
  notes: []
  aliases: []
  seeAlso:
  - sys.warn
  - sys.error
  since: '1.0'
- name: warn
  signature: sys.warn(...)
  summary: Write a warning to the console.
  description: Writes a warning line to the console, in the warning colour.
  params:
  - name: '...'
    type: any
    description: One or more values to write.
    required: true
  returns: null
  examples:
  - |-
    local enemies = {}
    if #enemies > 64 then sys.warn("too many enemies: " .. #enemies) end  -- one string: a comma would put a tab between the two
  notes: []
  aliases: []
  seeAlso:
  - sys.log
  - sys.error
  since: '2.0'
- name: error
  signature: sys.error(...)
  summary: Write an error line to the console.
  description: Writes an error line to the console, in the error colour. It reports a problem; it does
    not stop the game.
  params:
  - name: '...'
    type: any
    description: One or more values to write.
    required: true
  returns: null
  examples:
  - |-
    local n = 3
    local level = nil
    if not level then sys.error("level " .. n .. " is missing") end
  notes: []
  aliases: []
  seeAlso:
  - sys.log
  - sys.warn
  since: '2.0'
values: []
