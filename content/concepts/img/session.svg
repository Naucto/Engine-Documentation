<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 288" role="img" aria-label="A session goes from menu to waiting when the game calls net.host or net.join, to playing when the callback fires, and back to menu on net.leave or the ended event">
  <title>The session state machine: menu, waiting, playing, and back to menu</title>
  <g class="d-box">
    <rect x="24.5" y="8.5" width="128" height="32"/>
    <rect x="24.5" y="80.5" width="128" height="32"/>
    <rect x="24.5" y="160.5" width="128" height="48"/>
    <rect x="24.5" y="248.5" width="128" height="32"/>
  </g>
  <g class="d-stroke">
    <line x1="88.5" y1="40.5" x2="88.5" y2="80.5"/>
    <line x1="88.5" y1="112.5" x2="88.5" y2="160.5"/>
    <line x1="88.5" y1="208.5" x2="88.5" y2="248.5"/>
  </g>
  <g class="d-head">
    <polygon points="84.5,72 88.5,80 92.5,72"/>
    <polygon points="84.5,152 88.5,160 92.5,152"/>
    <polygon points="84.5,240 88.5,248 92.5,240"/>
  </g>
  <g class="d-label">
    <text x="88" y="29" text-anchor="middle" class="d-mono">"menu"</text>
    <text x="168" y="65" class="d-mono">net.host() or net.join()</text>
    <text x="88" y="101" text-anchor="middle" class="d-mono">"waiting"</text>
    <text x="168" y="101" class="d-quiet">a platform dialog is open</text>
    <text x="168" y="133" class="d-quiet">cancel: nothing fires</text>
    <text x="168" y="149">success: the callback fires</text>
    <text x="88" y="189" text-anchor="middle" class="d-mono">"playing"</text>
    <text x="168" y="173" class="d-mono">peer.joined</text>
    <text x="272" y="173" class="d-quiet">a player arrived</text>
    <text x="168" y="189" class="d-mono">peer.left</text>
    <text x="272" y="189" class="d-quiet">a player left</text>
    <text x="168" y="205" class="d-mono">ended</text>
    <text x="272" y="205" class="d-quiet">the host left</text>
    <text x="168" y="225" class="d-mono">net.leave()</text>
    <text x="168" y="241" class="d-quiet">or the "ended" callback</text>
    <text x="88" y="269" text-anchor="middle" class="d-mono">"menu"</text>
  </g>
</svg>
