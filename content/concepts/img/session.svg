<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 288" role="img" aria-label="A session goes from menu to waiting when the game calls net.host or net.join, to playing when the callback fires, and back to menu on net.leave or the ended event; from waiting, a key takes the player back to menu when the dialog was cancelled">
  <title>The session state machine: menu, waiting, playing, and back to menu, with a way back from waiting</title>
  <g class="d-box">
    <rect x="40.5" y="8.5" width="128" height="32"/>
    <rect x="40.5" y="80.5" width="128" height="32"/>
    <rect x="40.5" y="160.5" width="128" height="48"/>
    <rect x="40.5" y="248.5" width="128" height="32"/>
  </g>
  <g class="d-stroke">
    <line x1="104.5" y1="40.5" x2="104.5" y2="80.5"/>
    <line x1="104.5" y1="112.5" x2="104.5" y2="160.5"/>
    <line x1="104.5" y1="208.5" x2="104.5" y2="248.5"/>
    <polyline points="40.5,96.5 16.5,96.5 16.5,24.5 40.5,24.5"/>
  </g>
  <g class="d-head">
    <polygon points="100.5,72 104.5,80 108.5,72"/>
    <polygon points="100.5,152 104.5,160 108.5,152"/>
    <polygon points="100.5,240 104.5,248 108.5,240"/>
    <polygon points="32,20.5 40,24.5 32,28.5"/>
  </g>
  <g class="d-label">
    <text x="104" y="29" text-anchor="middle" class="d-mono">"menu"</text>
    <text x="184" y="65" class="d-mono">net.host() or net.join()</text>
    <text x="104" y="101" text-anchor="middle" class="d-mono">"waiting"</text>
    <text x="184" y="101" class="d-quiet">a platform dialog is open</text>
    <text x="184" y="125" class="d-quiet">cancel: nothing fires</text>
    <text x="184" y="141" class="d-quiet">a key goes back to "menu"</text>
    <text x="184" y="157">success: the callback fires</text>
    <text x="104" y="189" text-anchor="middle" class="d-mono">"playing"</text>
    <text x="184" y="173" class="d-mono">peer.joined</text>
    <text x="288" y="173" class="d-quiet">a player arrived</text>
    <text x="184" y="189" class="d-mono">peer.left</text>
    <text x="288" y="189" class="d-quiet">a player left</text>
    <text x="184" y="205" class="d-mono">ended</text>
    <text x="288" y="205" class="d-quiet">the host left</text>
    <text x="184" y="225" class="d-mono">net.leave()</text>
    <text x="184" y="241" class="d-quiet">or the "ended" callback</text>
    <text x="104" y="269" text-anchor="middle" class="d-mono">"menu"</text>
  </g>
</svg>
