<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="The code tabs run once, then _init once, then _update and _draw sixty times a second; an error anywhere halts the game">
  <title>The lifecycle of a game: tabs, _init, then the _update and _draw loop</title>
  <g class="d-box">
    <rect x="40.5" y="8.5" width="240" height="32"/>
    <rect x="40.5" y="64.5" width="240" height="32"/>
    <rect x="40.5" y="120.5" width="240" height="64"/>
    <rect x="40.5" y="208.5" width="240" height="32"/>
  </g>
  <g class="d-stroke">
    <line x1="160.5" y1="40.5" x2="160.5" y2="64.5"/>
    <line x1="160.5" y1="96.5" x2="160.5" y2="120.5"/>
    <line x1="160.5" y1="184.5" x2="160.5" y2="208.5"/>
    <line x1="280.5" y1="172.5" x2="312.5" y2="172.5"/>
    <polyline points="160.5,240.5 160.5,264.5 24.5,264.5 24.5,152.5 40.5,152.5"/>
  </g>
  <g class="d-head">
    <polygon points="156.5,56 160.5,64 164.5,56"/>
    <polygon points="156.5,112 160.5,120 164.5,112"/>
    <polygon points="156.5,200 160.5,208 164.5,200"/>
    <polygon points="304,168.5 312,172.5 304,176.5"/>
    <polygon points="32,148.5 40,152.5 32,156.5"/>
  </g>
  <g class="d-label">
    <text x="160" y="29" text-anchor="middle">code tabs run, in tab order</text>
    <text x="296" y="29" class="d-quiet">once, before anything</text>
    <text x="160" y="85" text-anchor="middle" class="d-mono">_init()</text>
    <text x="296" y="85" class="d-quiet">once</text>
    <text x="160" y="145" text-anchor="middle" class="d-mono">_update()</text>
    <text x="160" y="169" text-anchor="middle" class="d-mono">_draw()</text>
    <text x="296" y="145" class="d-quiet">one step, 1/60 s</text>
    <text x="320" y="166" class="d-quiet">error anywhere</text>
    <text x="320" y="188" class="d-quiet">--- HALTED ---</text>
    <text x="160" y="229" text-anchor="middle">screen shown</text>
    <text x="92" y="258" text-anchor="middle" class="d-quiet">next step</text>
  </g>
</svg>
