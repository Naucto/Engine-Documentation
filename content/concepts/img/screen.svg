<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="The 320 by 180 screen, with (0,0) at the top left, x growing to the right and y downward, and (319,179) at the bottom right">
  <title>The screen: 320 × 180 pixels, origin at the top left, x to the right, y down</title>
  <g class="d-box">
    <rect x="40.5" y="24.5" width="320" height="180"/>
  </g>
  <g class="d-stroke">
    <line x1="48.5" y1="32.5" x2="144.5" y2="32.5"/>
    <line x1="48.5" y1="32.5" x2="48.5" y2="104.5"/>
  </g>
  <g class="d-head">
    <polygon points="136,28.5 144,32.5 136,36.5"/>
    <polygon points="44.5,96 48.5,104 52.5,96"/>
  </g>
  <g class="d-label">
    <text x="40" y="18" class="d-mono">(0,0)</text>
    <text x="360" y="18" text-anchor="end" class="d-mono">(319,0)</text>
    <text x="40" y="222" class="d-mono">(0,179)</text>
    <text x="360" y="222" text-anchor="end" class="d-mono">(319,179)</text>
    <text x="152" y="37" class="d-gold">x</text>
    <text x="48.5" y="121" text-anchor="middle" class="d-gold">y</text>
    <text x="200" y="118" text-anchor="middle">320 × 180</text>
  </g>
</svg>
