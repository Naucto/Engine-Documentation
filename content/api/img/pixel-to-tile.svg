<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 160" role="img" aria-label="The pixel (37, 50) falls in tile (4, 6): each coordinate divided by 8 and floored; map.get reads that tile's sprite and map.flag its flags">
  <title>From a pixel to a tile: floor each coordinate divided by 8</title>
  <g class="d-box">
    <rect x="24.5" y="24.5" width="96" height="128"/>
  </g>
  <g>
    <rect class="d-fill-inset" x="88.5" y="120.5" width="16" height="16"/>
    <rect class="d-fill-inset" x="144.5" y="93.5" width="12" height="12"/>
  </g>
  <g class="d-stroke">
    <line x1="40.5" y1="24.5" x2="40.5" y2="152.5"/>
    <line x1="56.5" y1="24.5" x2="56.5" y2="152.5"/>
    <line x1="72.5" y1="24.5" x2="72.5" y2="152.5"/>
    <line x1="88.5" y1="24.5" x2="88.5" y2="152.5"/>
    <line x1="104.5" y1="24.5" x2="104.5" y2="152.5"/>
    <line x1="24.5" y1="40.5" x2="120.5" y2="40.5"/>
    <line x1="24.5" y1="56.5" x2="120.5" y2="56.5"/>
    <line x1="24.5" y1="72.5" x2="120.5" y2="72.5"/>
    <line x1="24.5" y1="88.5" x2="120.5" y2="88.5"/>
    <line x1="24.5" y1="104.5" x2="120.5" y2="104.5"/>
    <line x1="24.5" y1="120.5" x2="120.5" y2="120.5"/>
    <line x1="24.5" y1="136.5" x2="120.5" y2="136.5"/>
    <rect x="144.5" y="93.5" width="12" height="12"/>
  </g>
  <g>
    <circle class="d-fill-hot" cx="98.5" cy="124.5" r="3"/>
    <circle class="d-fill-hot" cx="150.5" cy="36.5" r="3"/>
  </g>
  <g class="d-label">
    <text x="96.5" y="18" text-anchor="middle" class="d-quiet">4</text>
    <text x="16" y="133" text-anchor="end" class="d-quiet">6</text>
    <text x="160" y="40" class="d-gold">pixel (37, 50)</text>
    <text x="144" y="64" class="d-mono">math.floor(37 / 8) = 4</text>
    <text x="144" y="80" class="d-mono">math.floor(50 / 8) = 6</text>
    <text x="164" y="104" class="d-gold">tile (4, 6)</text>
    <text x="144" y="128" class="d-mono">map.get(4, 6)</text>
    <text x="264" y="128" class="d-quiet">sprite n</text>
    <text x="144" y="144" class="d-mono">map.flag(n, 0)</text>
    <text x="264" y="144" class="d-quiet">solid?</text>
  </g>
</svg>
