<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="The beam reads the index frame _draw() wrote line by line, calling _scanline(y) for each, through the frame's line state (palette, shift, blank) or the state a line set for itself and the lines below">
  <title>The beam reads the index frame _draw() wrote line by line, calling _scanline(y) for each, through the frame's line state (palette, shift, blank) or the state a line set for itself and the lines below</title>
  <g class="d-box">
    <rect x="8.5" y="40.5" width="144" height="96"/>
  </g>
  <g>
    <rect x="320.5" y="40.5" width="16" height="48" class="d-fill-sky"/>
    <rect x="320.5" y="88.5" width="16" height="48" class="d-fill-orange"/>
  </g>
  <g class="d-stroke">
    <rect x="192.5" y="40.5" width="128" height="96"/>
    <rect x="320.5" y="40.5" width="16" height="96"/>
    <line x1="320.5" y1="88.5" x2="336.5" y2="88.5"/>
    <line x1="152.5" y1="88.5" x2="184.5" y2="88.5"/>
    <line x1="200.5" y1="64.5" x2="304.5" y2="64.5"/>
    <line x1="200.5" y1="80.5" x2="304.5" y2="80.5"/>
    <line x1="200.5" y1="96.5" x2="304.5" y2="96.5"/>
    <line x1="200.5" y1="112.5" x2="304.5" y2="112.5"/>
    <line x1="312.5" y1="48.5" x2="312.5" y2="120.5"/>
    <line x1="256.5" y1="136.5" x2="256.5" y2="160.5"/>
  </g>
  <g class="d-head">
    <polygon points="184,84.5 192,88.5 184,92.5"/>
    <polygon points="308.5,120 312.5,128 316.5,120"/>
    <polygon points="252.5,160 256.5,168 260.5,160"/>
  </g>
  <g class="d-label">
    <text x="80" y="64" text-anchor="middle" class="d-mono d-gold">_draw()</text>
    <text x="80" y="88" text-anchor="middle">index frame</text>
    <text x="80" y="104" text-anchor="middle">320×180 numbers</text>
    <text x="80" y="120" text-anchor="middle" class="d-quiet">colours 0..15</text>
    <text x="256" y="32" text-anchor="middle" class="d-mono d-gold">_scanline(y)</text>
    <text x="200" y="56" class="d-quiet">y = 0</text>
    <text x="200" y="130" class="d-quiet">y = 179</text>
    <text x="344" y="56">frame palette (16)</text>
    <text x="344" y="72" class="d-quiet">+ shift</text>
    <text x="344" y="100" class="d-mono">set_color</text>
    <text x="424" y="100">in</text>
    <text x="448" y="100" class="d-mono">_scanline</text>
    <text x="344" y="116" class="d-quiet">this line and below</text>
    <text x="256" y="184" text-anchor="middle">pixels on screen</text>
  </g>
</svg>
